<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Painel dos barbeiros</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #eef1f5;
      color: #202b36;
      font: 16px system-ui, sans-serif;
    }

    main {
      max-width: 1040px;
      margin: auto;
      padding: 32px 18px;
    }

    header { margin-bottom: 26px; }
    h1 { margin: 0 0 8px; font-size: 28px; }
    h2 { margin: 0; font-size: 24px; }
    p { line-height: 1.5; }
    .muted { color: #637181; }
    #connection { font-size: 14px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      border-top: 5px solid var(--accent);
      box-shadow: 0 5px 22px #202b3610;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .badge {
      background: #eef1f5;
      padding: 6px 10px;
      border-radius: 30px;
      font-size: 13px;
    }

    .chair {
      background: #f5f7fa;
      border-radius: 12px;
      padding: 18px;
      margin: 22px 0 16px;
    }

    .label {
      font-size: 13px;
      color: #637181;
      margin-bottom: 6px;
    }

    .name {
      font-size: 25px;
      font-weight: 750;
      overflow-wrap: anywhere;
    }

    .next {
      padding: 0 2px 18px;
      overflow-wrap: anywhere;
    }

    button, .whatsapp {
      display: block;
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 9px;
      font: 600 15px system-ui;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
    }

    button {
      background: var(--accent);
      color: white;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .whatsapp {
      margin-top: 10px;
      color: #146c36;
      border: 1px solid #b9dfc5;
      background: #effaf2;
    }

    .whatsapp[hidden] { display: none; }

    .feedback {
      font-size: 14px;
      min-height: 22px;
      margin: 12px 0;
      color: #526170;
    }

    ol { padding-left: 26px; margin-bottom: 0; }

    li {
      padding: 10px 0;
      border-top: 1px solid #edf0f3;
      overflow-wrap: anywhere;
    }

    li span {
      display: block;
      color: #637181;
      font-size: 13px;
    }

    .empty { color: #637181; font-size: 14px; }

    .note {
      font-size: 14px;
      color: #637181;
      margin-top: 24px;
    }

    @media (max-width: 680px) {
      .grid { grid-template-columns: 1fr; }
      main { padding-top: 22px; }
      .card { padding: 20px; }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>Painel dos barbeiros</h1>
      <div class="muted">
        Atenda o primeiro e avise quem vem em seguida.
      </div>
      <p id="connection" role="status">Conectando à fila…</p>
    </header>

    <div class="grid" id="panels"></div>

    <p class="note">
      Ao chamar um cliente, o WhatsApp do próximo abre com a mensagem pronta.
      Confira e toque em Enviar. Se a janela não abrir, use o botão de aviso.
    </p>
  </main>

  <script>
    'use strict';

    const names = {
      jalbanis: 'Jalbanis',
      viny: 'Viny'
    };

    const state = {};
    let connected = false;
    let db;

    function clients(data) {
      return Object.entries(data || {})
        .filter(([, value]) =>
          value &&
          typeof value === 'object' &&
          typeof value.nome === 'string'
        )
        .map(([id, value]) => ({ ...value, id }))
        .sort((a, b) =>
          (Number(a.timestamp) || 0) - (Number(b.timestamp) || 0) ||
          a.id.localeCompare(b.id)
        );
    }

    function parts(data) {
      const all = clients(data);

      return {
        current: all.find(client => client.status === 'atendendo') || null,
        waiting: all.filter(client => client.status !== 'atendendo')
      };
    }

    function phone(value) {
      let number = String(value || '').replace(/\D/g, '');

      if (number.length === 10 || number.length === 11) {
        number = '55' + number;
      }

      return /^55\d{10,11}$/.test(number) ? number : null;
    }

    function whatsapp(client, key) {
      const number = phone(client.whatsapp);
      if (!number) return null;

      const message =
        `Olá, ${client.nome}! Você é o próximo da fila com ` +
        `${names[key]}. Já pode vir para o salão.`;

      return `https://wa.me/${number}?text=${encodeURIComponent(message)}`;
    }

    function el(tag, text, className) {
      const node = document.createElement(tag);

      if (text !== undefined) node.textContent = text;
      if (className) node.className = className;

      return node;
    }

    for (const key of Object.keys(names)) {
      const card = el('section', undefined, 'card');

      card.style.setProperty(
        '--accent',
        key === 'jalbanis' ? '#229b50' : '#e97a12'
      );

      const top = el('div', undefined, 'top');
      const count = el('span', 'Carregando…', 'badge');
      top.append(el('h2', names[key]), count);

      const chair = el('div', undefined, 'chair');
      const current = el('div', '—', 'name');

      chair.append(
        el('div', 'NA CADEIRA AGORA', 'label'),
        current
      );

      const next = el('div', undefined, 'next');
      const nextName = el('strong', '—');

      next.append(
        el('div', 'PRÓXIMO A SER ATENDIDO', 'label'),
        nextName
      );

      const action = el('button', 'Carregando…');
      action.disabled = true;
      action.onclick = () => advance(key);

      const link = el('a', 'Avisar próximo no WhatsApp', 'whatsapp');
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.hidden = true;

      const feedback = el('p', '', 'feedback');
      feedback.setAttribute('role', 'status');

      const list = el('ol');
      const empty = el('p', 'Fila vazia.', 'empty');

      card.append(
        top,
        chair,
        next,
        action,
        link,
        feedback,
        el('h3', 'Fila de espera'),
        empty,
        list
      );

      document.getElementById('panels').append(card);

      state[key] = {
        data: null,
        loaded: false,
        busy: false,
        error: false,
        count,
        current,
        nextName,
        action,
        link,
        feedback,
        list,
        empty
      };
    }

    function render(key) {
      const s = state[key];
      const queue = parts(s.data);

      s.current.textContent = queue.current
        ? queue.current.nome
        : 'Ninguém em atendimento';

      s.nextName.textContent =
        queue.waiting[0]?.nome || 'Ninguém aguardando';

      s.count.textContent = `${queue.waiting.length} aguardando`;

      s.action.textContent = s.busy
        ? 'Salvando…'
        : queue.current
          ? queue.waiting.length
            ? 'Concluir e chamar próximo'
            : 'Concluir atendimento'
          : 'Chamar primeiro da fila';

      s.action.disabled =
        !connected ||
        !s.loaded ||
        s.busy ||
        s.error ||
        (!queue.current && !queue.waiting.length);

      s.list.replaceChildren();
      s.empty.hidden = queue.waiting.length > 0;

      queue.waiting.forEach((client, index) => {
        const row = el('li');

        row.append(
          el('strong', client.nome),
          el(
            'span',
            index === 0 ? 'Próximo a ser atendido' : 'Aguardando'
          )
        );

        s.list.append(row);
      });

      const url = queue.current && queue.waiting[0]
        ? whatsapp(queue.waiting[0], key)
        : null;

      s.link.hidden = !url;

      if (url) {
        s.link.href = url;
      } else {
        s.link.removeAttribute('href');
      }
    }

    async function advance(key) {
      const s = state[key];
      if (s.action.disabled) return;

      const before = parts(s.data);
      const expectedCurrent = before.current?.id || null;
      const expectedNext = before.waiting[0]?.id || null;

      s.busy = true;
      s.feedback.textContent = 'Atualizando atendimento…';
      render(key);

      // Abre durante o clique para evitar bloqueio de janela pelo navegador.
      const shouldNotify = before.waiting.length > 1;
      const popup = shouldNotify
        ? window.open('about:blank', '_blank')
        : null;

      if (popup) popup.opener = null;

      try {
        const result = await db.ref(`barbeiros/${key}`).transaction(
          data => {
            if (!data) return;

            const queue = parts(data);

            // Impede que dois painéis avancem o mesmo atendimento.
            if (
              (queue.current?.id || null) !== expectedCurrent ||
              (queue.waiting[0]?.id || null) !== expectedNext
            ) {
              return;
            }

            if (queue.current) {
              delete data[queue.current.id];
            }

            if (queue.waiting[0]) {
              data[queue.waiting[0].id].status = 'atendendo';
            }

            return data;
          },
          undefined,
          false
        );

        if (!result.committed) {
          if (popup) popup.close();

          s.feedback.textContent =
            'A fila mudou em outro painel. Confira e tente novamente.';

          return;
        }

        s.data = result.snapshot.val();

        const after = parts(s.data);
        const target = after.current && after.waiting[0];
        const url = target ? whatsapp(target, key) : null;

        if (url) {
          if (popup) popup.location.replace(url);

          s.feedback.textContent = popup
            ? 'Atendimento atualizado. Envie a mensagem na aba do WhatsApp.'
            : 'Atendimento atualizado. Clique em Avisar próximo no WhatsApp.';
        } else {
          if (popup) popup.close();

          s.feedback.textContent = target
            ? 'Atendimento atualizado. O WhatsApp do próximo está inválido; confira o cadastro.'
            : after.current
              ? 'Atendimento iniciado. Ninguém mais aguardando.'
              : 'Atendimento concluído. Fila vazia.';
        }
      } catch (error) {
        if (popup) popup.close();

        s.feedback.textContent =
          'Não foi possível atualizar: ' + error.message;
      } finally {
        s.busy = false;
        render(key);
      }
    }

    try {
      if (typeof firebase === 'undefined') {
        throw new Error(
          'Não foi possível carregar o Firebase. Confira a internet e recarregue a página.'
        );
      }

      if (!firebase.apps.length) {
        firebase.initializeApp({
          databaseURL: 'https://fila-salao-52932-default-rtdb.firebaseio.com/'
        });
      }

      db = firebase.database();

      db.ref('.info/connected').on('value', snapshot => {
        connected = snapshot.val() === true;

        document.getElementById('connection').textContent = connected
          ? '● Conectado • fila em tempo real'
          : 'Sem conexão • aguardando reconectar';

        Object.keys(names).forEach(render);
      });

      for (const key of Object.keys(names)) {
        db.ref(`barbeiros/${key}`).on(
          'value',
          snapshot => {
            state[key].data = snapshot.val();
            state[key].loaded = true;
            state[key].error = false;
            render(key);
          },
          error => {
            state[key].error = true;
            state[key].feedback.textContent =
              'Não foi possível ler a fila: ' + error.message;

            render(key);
          }
        );
      }
    } catch (error) {
      document.getElementById('connection').textContent = error.message;
    }
  </script>
</body>
</html>
